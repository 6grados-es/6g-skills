<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tu plataforma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Montserrat:wght@600&display=swap">
<script src="datos.js"></script>
<style>
/* Tu plataforma · 6 Grados. Blanco y negro con el sistema de diseño de 6 Grados (Geist, menú a la izquierda, punto rojo
   en el título, tema claro y oscuro). La marca sale de `marca` en datos.js: para adaptarla se cambia ahí, no aquí. */
:root {
  color-scheme: light;
  --marca: #dc0a06;
  --acento: #171213; --acento-texto: #ffffff;
  --pagina: #f6f3f3; --tarjeta: #ffffff; --menu: #ffffff; --hueco: #f1eded;
  --tinta: #171213; --tinta-2: #4b4244; --tinta-3: #6f6466;
  --linea: rgba(0,0,0,.09); --linea-fuerte: rgba(0,0,0,.2); --gris: rgba(0,0,0,.045);
  --ok: #1d7a46; --mal: #c42b1c; --aviso: #9a6400;
  --sombra: 0 1px 2px rgba(0,0,0,.04), 0 6px 24px rgba(0,0,0,.05);
  --radio: 18px;
  --logo-filtro: none;
  --f-texto: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --f-ceja: 'Montserrat', 'Geist', sans-serif;
}
html[data-tema='oscuro'] {
  color-scheme: dark;
  --marca: #f2413d;
  --acento: #ffffff; --acento-texto: #000000;
  --pagina: #000000; --tarjeta: #121011; --menu: #0a0708; --hueco: #1b1718;
  --tinta: #ffffff; --tinta-2: #c9bec0; --tinta-3: #968a8c;
  --linea: rgba(255,255,255,.1); --linea-fuerte: rgba(255,255,255,.24); --gris: rgba(255,255,255,.06);
  --ok: #4cc27f; --mal: #f0867f; --aviso: #e3b34d;
  --sombra: none;
  --logo-filtro: invert(1);
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { font-family: var(--f-texto); font-size: 15px; line-height: 1.5; color: var(--tinta); background: var(--pagina); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a, a:visited { color: var(--tinta); }
.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; }

/* ---------- menú ---------- */
.menu { background: var(--menu); border-right: 1px solid var(--linea); padding: 22px 14px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; }
.marca { display: flex; align-items: center; gap: 12px; padding: 2px 10px 24px; }
.marca-logo { width: 38px; height: 38px; border-radius: 11px; background: var(--acento); color: var(--acento-texto); display: grid; place-items: center; font-weight: 600; font-size: 17px; flex: none; overflow: hidden; }
.marca-logo img { width: 100%; height: 100%; object-fit: cover; }
button.marca-logo { border: 0; padding: 0; position: relative; cursor: pointer; }
button.marca-logo .cambiar { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.55); color: #fff; opacity: 0; transition: opacity .12s; }
button.marca-logo .cambiar svg { width: 16px; height: 16px; }
button.marca-logo:hover .cambiar, button.marca-logo:focus-visible .cambiar { opacity: 1; }
.rutina .disparo .comprueba { display: block; font-size: 12px; color: var(--tinta-3); margin-top: 2px; }
.marca b { display: block; font-weight: 600; letter-spacing: -.01em; line-height: 1.2; }

          svg(x.icono, 'ico'), h('span', { class: 'txt' }, [h('b', {}, x.titulo)]), bloq ? svg('candado', 'cand') : null
        ]);
      })),
      h('div', { class: 'pie-menu' }, [
        h('div', { class: 'puente' + (puente ? ' on' : '') }, [h('i'), puente ? 'Conectada: lo que cambies se guarda' : 'Solo para mirar. Para cambiar cosas, ábrela con «Abrir plataforma»']),
        h('button', { class: 'tema', 'aria-label': 'Cambiar tema', onclick: function () { tema = tema === 'oscuro' ? 'claro' : 'oscuro'; aplicarTema(); pintar(); } }, [svg(tema === 'oscuro' ? 'sol' : 'luna'), h('span', {}, tema === 'oscuro' ? 'Tema claro' : 'Tema oscuro')]),
        h('button', { class: 'tema', onclick: configuracion }, [svg('engranaje'), h('span', {}, 'Configuración')]),
        D.actualizado ? h('span', { class: 'fecha' }, 'Actualizado el ' + D.actualizado) : null
      ])
    ]);
    var cuerpo = !desb[p.id] ? bloqueada(p) : p.id === 'conectores' ? vistaConectores() : p.id === 'skills' ? vistaSkills() : vistaApps();
    raiz.appendChild(h('div', { class: 'app' }, [menu, h('main', { class: 'contenido' }, [h('p', { class: 'ceja' }, p.titulo), h('h1', {}, p.h1), h('p', { class: 'sub' }, p.sub), cuerpo])]));
    window.scrollTo(0, y);
  }
  aplicarTema(); aplicarMarca(); pintar(); comprobarPuente();
})();
</script>
